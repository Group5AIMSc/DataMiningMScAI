{% extends "layout.html" %}
{% block content %}
<h2 class="page-title">Trips per Day</h2>
<div class="chart-container">
    <div id="trips-day-chart" style="height:500px;"></div>
    <p class="explain">Number of taxi trips for each day of the month.</p>
</div>

<script>
fetch('/api/trips_per_day')
.then(r => r.json())
.then(data => {
    const days = data.map(d => d.day);
    const trips = data.map(d => d.trips);

    const trace = {
        x: days,
        y: trips,
        type: 'bar',
        marker: {color: 'rgb(255,204,0)'},
        hovertemplate: 'Day %{x}: %{y} trips<extra></extra>'
    };

    const layout = {
        title: 'NYC Taxi Trips per Day',
        xaxis: {title:'Day of Month', dtick:1},
        yaxis: {title:'Number of Trips'},
        margin:{t:50,b:50}
    };

    Plotly.newPlot('trips-day-chart', [trace], layout, {responsive:true});
});
</script>
{% endblock %}
